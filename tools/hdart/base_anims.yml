# base_anims.yml - анимации построек базы для gen_base_anim.py.
#
# Ключ - код постройки (type из рулсета). Поля:
#   like: <код>      - сначала эффекты другой постройки или шаблона (_имя), потом свои
#   skip: true       - не трогать (анимация уже сделана своим генератором)
#   effects: [...]   - список эффектов по порядку
#
# Выборка sel (все поля необязательны, координаты - пиксели классики, 32 на клетку):
#   color: red|orange|yellow|green|cyan|blue|purple|white|grey|dark или список
#   bright / darker: порог яркости 0..1;  rect: [x0, y0, x1, y1] или список;  not_rect;
#   inset: N - без рамки в N пикселей;  min / max - площадь связного куска;
#   largest: N - N крупнейших;  merge: true - все куски одним
#
# Эффекты (fx) и главные ключи:
#   pulse   amp, glow, radius, stagger, speed, tint     - яркость дышит, ореол
#   blink   period, duty, dim, glow, stagger same|seq|random, order x|angle
#   flicker lo, hi, seed                                  - случайная яркость по кускам
#   ripple  amp, wavelength, angle, glint                 - рябь воды
#   bubbles count, radius [min,max]                       - пузыри лопаются кольцами
#   smoke   at | sel, color, rise, r0, r1, opacity, puffs, limit - дым / пар
#   sparks  at | sel, color, spread, chance, count         - искры
#   fire    strength, cells                                - пламя по выборке
#   sweep   center, turns, ccw, tail, amp, tint            - вращающийся блик
#   band    angle, width, amp, pause, speed                - бегущая полоса света
#   sway    amp, wavelength, angle, anchor_x, reach        - колыхание
#   swarm   at | sel, count, radius, size, color, glow     - рой точек
#   roll    rect, period, axis x|y, reverse                - конвейер
#   lid     cover {фаза: доля}                              - моргание
#   breathe center, amp, beat                              - вздох / удар сердца
#   tint    tint, amp, radius, stagger                     - цветное свечение дышит

# ---------------------------------------------------------------- шаблоны

_craters:
  effects:
    - {fx: smoke, sel: {color: dark, min: 4, max: 90, inset: 3}, limit: 6, opacity: 0.5, rise: 9}
    - {fx: sparks, sel: {color: dark, min: 4, max: 90, inset: 3}, limit: 3, chance: 0.25, count: 2, seed: 31}

