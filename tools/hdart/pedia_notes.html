<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Досмотр педии</title>
<style>
:root { --bg:#16181c; --panel:#1f2228; --line:#30343c; --text:#e4e6ea; --dim:#9aa0aa; --acc:#6aa8ff;
        --ok:#3fae6a; --redo:#e0584f; --doubt:#d9a33b; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, "Segoe UI", sans-serif;
       display:flex; height:100vh; overflow:hidden; }
aside { width:290px; flex:none; border-right:1px solid var(--line); display:flex; flex-direction:column; background:var(--panel); }
aside .tools { padding:10px; display:flex; flex-direction:column; gap:6px; border-bottom:1px solid var(--line); }
select, input[type=search], textarea, button { font:inherit; color:var(--text); background:#14161a;
       border:1px solid var(--line); border-radius:6px; }
select, input[type=search] { padding:6px 8px; width:100%; }
#count { color:var(--dim); font-size:12px; }
#list { overflow-y:auto; flex:1; }
#list div { padding:4px 10px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
            border-left:3px solid transparent; font-size:13px; }
#list div:hover { background:#272b33; }
#list div.cur { background:#2b3340; border-left-color:var(--acc); }
#list div.s-ok { color:var(--ok); } #list div.s-redo { color:var(--redo); } #list div.s-doubt { color:var(--doubt); }
#list div .n { color:var(--dim); font-size:11px; margin-left:4px; }
main { flex:1; overflow-y:auto; padding:14px 18px 40px; }
header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
header h1 { font-size:18px; margin:0; font-weight:600; }
.nav button { padding:4px 12px; cursor:pointer; }
.chip { font-size:12px; padding:2px 8px; border-radius:10px; background:#2a2f38; color:#cdd3dc; }
.chip.found { background:#4a2a2a; color:#ffc9c4; } .chip.flag { background:#3a3320; color:#f3dc9b; }
.chip.grp { background:#22324a; color:#bcd6ff; }
.pics { display:grid; grid-template-columns:repeat(var(--cols,2), 1fr); gap:10px; }
.pic { background:#000; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.pic .cap { font-size:12px; color:var(--dim); padding:4px 8px; background:var(--panel); display:flex; justify-content:space-between; }
.pic .box { aspect-ratio:320/200; display:flex; align-items:center; justify-content:center; cursor:zoom-in; }
.pic img { width:100%; height:100%; object-fit:contain; display:block; }
.pic img.px { image-rendering:pixelated; }
.pic .none { color:var(--dim); }
.opts { display:flex; gap:14px; margin:8px 0 4px; color:var(--dim); font-size:13px; flex-wrap:wrap; }
section { margin-top:14px; }
section h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); margin:0 0 6px; font-weight:600; }
.art { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:8px; }
.art b { display:block; margin-bottom:4px; }
.art .t { white-space:pre-wrap; } .art .sec { color:var(--dim); font-size:12px; }
.small { color:var(--dim); font-size:12px; }
textarea { width:100%; padding:8px 10px; resize:vertical; }
#prompt { min-height:120px; font-size:13px; } #note { min-height:90px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; }
.st button { padding:6px 14px; cursor:pointer; }
.st button.on[data-s=ok] { background:var(--ok); border-color:var(--ok); color:#fff; }
.st button.on[data-s=redo] { background:var(--redo); border-color:var(--redo); color:#fff; }
.st button.on[data-s=doubt] { background:var(--doubt); border-color:var(--doubt); color:#111; }
#saved { color:var(--dim); font-size:12px; }
details summary { cursor:pointer; color:var(--dim); font-size:12px; }
#zoom { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; cursor:zoom-out; z-index:9; }
#zoom img { max-width:98vw; max-height:98vh; }
#zoom img.px { image-rendering:pixelated; width:min(98vw, 98vh * 1.6); }
kbd { background:#2a2f38; border-radius:3px; padding:0 4px; font-size:11px; }
.round { display:none; } body.rd .round { display:flex; } body.rd section.round { display:block; }
body.rd .st, body.rd section.norm { display:none; }
.pic .take { width:100%; border:0; border-top:1px solid var(--line); border-radius:0; padding:8px; cursor:pointer; background:#23303f; }
.pic .take:hover { background:#2d4560; }
.pic.picked { border-color:var(--ok); box-shadow:0 0 0 2px var(--ok); } .pic.picked .take { background:var(--ok); color:#fff; }
.pic.wait { display:flex; align-items:center; justify-content:center; color:var(--dim); padding:20px; text-align:center; }
.round button { padding:6px 14px; cursor:pointer; }
</style>
</head>
<body>
<aside>
  <div class="tools">
    <select id="filter"></select>
    <input id="q" type="search" placeholder="поиск по имени и тексту">
    <div id="count"></div>
  </div>
  <div id="list"></div>
</aside>
<main>
  <header>
    <span class="nav"><button id="prev" title="Предыдущая (←)">◀</button> <button id="next" title="Следующая (→)">▶</button></span>
    <h1 id="name"></h1>
    <span id="chips"></span>
  </header>
  <div class="opts">
    <label><input type="checkbox" id="show18"> показывать 18+</label>
    <label><input type="checkbox" id="showEn"> текст статьи по-английски</label>
    <span><kbd>←</kbd> <kbd>→</kbd> — листать (когда курсор не в поле ввода)</span>
  </div>
  <div class="pics" id="pics"></div>
  <section>
    <h2>Статья педии</h2>
    <div id="arts"></div>
    <div class="small" id="caption"></div>
  </section>
  <section class="round">
    <h2>Ваша заметка при досмотре</h2>
    <div class="art"><div class="t" id="vnote"></div><div class="small" id="asked"></div></div>
  </section>
  <section>
    <h2 id="noteTitle">Что не в порядке — ваша заметка</h2>
    <textarea id="note" placeholder="Например: вместо рыжей женщины мужчина; пропал пистолет; фон должен быть пустым"></textarea>
    <div class="row round">
      <button data-p="again">Ничего не годится — ещё раз</button>
      <button data-p="keep">Оставить как было</button>
      <button data-p="">Снять выбор</button>
      <span class="small">«Беру этот» — под картинкой кандидата</span>
    </div>
    <div class="row st">
      <button data-s="ok">В порядке</button>
      <button data-s="redo">Переделать</button>
      <button data-s="doubt">Сомневаюсь</button>
      <button data-s="">Снять оценку</button>
      <span id="saved"></span>
    </div>
  </section>
  <section class="norm">
    <h2>Промпт для перекрафта</h2>
    <div class="small" id="why"></div>
    <textarea id="prompt" placeholder="Своего промпта нет — можно написать здесь"></textarea>
    <div class="row">
      <button id="reset" title="Вернуть промпт, который собирает pedia_batch">Вернуть исходный</button>
      <span class="small" id="pstate"></span>
    </div>
    <details><summary>негатив и сила</summary><div class="small" id="neg"></div></details>
  </section>
</main>
<div id="zoom"><img alt=""></div>
<script>
const $ = id => document.getElementById(id);
let cards = [], view = [], cur = -1, timer = null;

let ROUND = "";
const ROUND_FILTERS = [
  ["open", "Ещё не выбраны", c => !c.pick || c.pick === "again"],
  ["ready", "Не выбраны, кандидаты готовы", c => (!c.pick || c.pick === "again") && c.cands.length > 0],
  ["picked", "Выбран кандидат", c => /^[eo]\d$/.test(c.pick)],
  ["again", "Ещё раз", c => c.pick === "again"],
  ["keep", "Оставить как было", c => c.pick === "keep"],
  ["all", "Все картинки круга", c => true],
];
let FILTERS = [
  ["notok", "Все, кроме одобренных", c => c.status !== "ok"],
  ["all", "Все картинки", c => true],
  ["todo", "Не оценены", c => !c.status],
  ["noted", "С заметкой", c => c.note.trim() !== ""],
  ["redo", "Переделать", c => c.status === "redo"],
  ["doubt", "Сомневаюсь", c => c.status === "doubt"],
  ["ok", "В порядке", c => c.status === "ok"],
  ["found", "Подмены, найденные проверкой 29.10", c => c.found !== ""],
  ["flags", "Флаги модели (досмотренные 363)", c => c.flags.length > 0],
  ["audit", "Любая группа аудита 28.10", c => c.groups.length > 0],
  ["nohd", "Нет HD", c => !c.hd],
  ["h18", "Есть 18+", c => c.h18],
];

function loadPrefs() {
  try { $("show18").checked = localStorage.getItem("pn18") === "1"; $("showEn").checked = localStorage.getItem("pnEn") === "1";
        const f = localStorage.getItem("pnF" + ROUND); if (f) $("filter").value = f; } catch (e) {}
}
function savePref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function applyFilter(keep) {
  const f = FILTERS.find(x => x[0] === $("filter").value) || FILTERS[0];
  const q = $("q").value.trim().toLowerCase();
  const was = cur >= 0 ? view[cur] : null;
  view = cards.filter(c => f[2](c) && (!q || c.stem.toLowerCase().includes(q) ||
          c.articles.some(a => (a.title + " " + a.text + " " + a.en).toLowerCase().includes(q)) || c.note.toLowerCase().includes(q)));
  $("count").textContent = view.length + " из " + cards.length;
  const list = $("list"); list.innerHTML = "";
  view.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "s-" + listState(c);
    d.textContent = c.stem;
    const mark = ROUND ? (c.pick ? " " + pickRu(c.pick) : (c.cands.length ? " ●" + c.cands.length : " …")) : (c.note.trim() ? " ✎" : "");
    if (mark) { const n = document.createElement("span"); n.className = "n"; n.textContent = mark; d.appendChild(n); }
    d.onclick = () => show(i);
    list.appendChild(d);
  });
  let i = keep && was ? view.indexOf(was) : -1;
  if (i < 0 && location.hash) i = view.findIndex(c => c.key === decodeURIComponent(location.hash.slice(1)).toLowerCase());
  show(i >= 0 ? i : (view.length ? 0 : -1));
}

function listState(c) {
  if (!ROUND) return c.status || "none";
  return /^[eo]\d$/.test(c.pick) ? "ok" : c.pick === "again" ? "redo" : c.pick === "keep" ? "doubt" : "none";
}
function pickRu(p) { return p === "again" ? "ещё раз" : p === "keep" ? "как было" : p ? "взят " + p : ""; }
const VAR_RU = { e1: "правка, зерно 1", e2: "правка, зерно 2", o1: "из оригинала", o2: "из оригинала, зерно 2" };

function chip(text, cls) { const s = document.createElement("span"); s.className = "chip " + cls; s.textContent = text; return s; }

function pic(label, src, px, extra, pickVar) {
  const d = document.createElement("div"); d.className = "pic" + (pickVar && view[cur].pick === pickVar ? " picked" : "");
  const cap = document.createElement("div"); cap.className = "cap";
  const l = document.createElement("span"); l.textContent = label; cap.appendChild(l);
  const r = document.createElement("span"); cap.appendChild(r);
  const box = document.createElement("div"); box.className = "box";
  if (src) {
    const im = document.createElement("img"); im.src = src; im.alt = label; if (px) im.className = "px";
    im.onload = () => { r.textContent = im.naturalWidth + "×" + im.naturalHeight + (extra || ""); };
    box.onclick = () => { const z = $("zoom"); z.firstChild.src = src; z.firstChild.className = px ? "px" : ""; z.style.display = "flex"; };
    box.appendChild(im);
  } else { const n = document.createElement("span"); n.className = "none"; n.textContent = "нет картинки"; box.appendChild(n); }
  d.append(cap, box);
  if (pickVar) {
    const b = document.createElement("button"); b.className = "take";
    b.textContent = view[cur].pick === pickVar ? "✓ выбран" : "Беру этот";
    b.onclick = () => pick(pickVar);
    d.appendChild(b);
  }
  return d;
}

function renderPics(c) {
  const ps = $("pics"); ps.innerHTML = "";
  const v = encodeURIComponent(c.key);
  ps.appendChild(pic("Оригинал игры", "/img/orig/" + v, true));
  ps.appendChild(pic(ROUND ? "Наша HD сейчас" : "Наша HD (обычный режим)", c.hd ? "/img/hd/" + v : null, false));
  const s18 = $("show18").checked || (ROUND && c.base === "h18");
  if (s18) ps.appendChild(pic("Наша HD 18+", c.h18 ? "/img/h18/" + v : null, false));
  let n = 2 + (s18 ? 1 : 0);
  if (ROUND) {
    c.cands.forEach(k => ps.appendChild(pic("Новый: " + k.var + " — " + (VAR_RU[k.var] || k.var), "/img/cand/" + encodeURIComponent(k.file), false, "", k.var)));
    if (!c.cands.length) { const d = document.createElement("div"); d.className = "pic wait"; d.textContent = "новые варианты ещё рисуются — страница обновится сама"; ps.appendChild(d); }
    n += Math.max(1, c.cands.length);
  }
  ps.style.setProperty("--cols", Math.min(n, 3));
}

async function pick(p) {
  if (cur < 0) return;
  const c = view[cur];
  $("saved").textContent = "сохраняю…";
  try {
    const r = await fetch("/api/pick", { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify({ stem: c.stem, pick: p, note: $("note").value }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    c.pick = p; c.pick_note = $("note").value; c.pick_when = j.when;
    const d = $("list").children[cur];
    if (d) { d.className = "s-" + listState(c) + " cur"; const m = d.querySelector(".n"); if (m) m.textContent = " " + pickRu(p); }
    $("saved").textContent = "сохранено " + j.when;
    // выбранное уходит из списка: дальше - следующая картинка
    if (p && p !== "again" && cur < view.length - 1) setTimeout(() => show(cur + 1), 350); else renderPics(c);
  } catch (e) { $("saved").textContent = "НЕ СОХРАНЕНО: " + e.message; }
}

function show(i) {
  flush();
  cur = i;
  [...$("list").children].forEach((d, j) => d.classList.toggle("cur", j === i));
  if (i < 0) { $("name").textContent = "ничего не найдено"; $("pics").innerHTML = ""; return; }
  const c = view[i];
  $("list").children[i].scrollIntoView({ block: "nearest" });
  history.replaceState(null, "", "#" + encodeURIComponent(c.stem));
  $("name").textContent = c.stem;
  const ch = $("chips"); ch.innerHTML = "";
  if (c.found) ch.appendChild(chip(c.found, "found"));
  c.flags.forEach(f => ch.appendChild(chip("модель: " + f, "flag")));
  c.groups.forEach(g => ch.appendChild(chip(g, "grp")));
  renderPics(c);
  const en = $("showEn").checked, arts = $("arts"); arts.innerHTML = "";
  if (!c.articles.length) arts.innerHTML = '<div class="small">Статьи с этой картинкой не найдено.</div>';
  c.articles.forEach(a => {
    const d = document.createElement("div"); d.className = "art";
    const b = document.createElement("b"); b.textContent = a.title;
    const sec = document.createElement("div"); sec.className = "sec"; sec.textContent = a.section;
    const t = document.createElement("div"); t.className = "t"; t.textContent = (en ? a.en : a.text) || "(без текста)";
    d.append(b, sec, t); arts.appendChild(d);
  });
  $("caption").textContent = c.caption ? "Описание картинки моделью (по нему собран промпт): " + c.caption : "";
  if (ROUND) {
    $("vnote").textContent = c.vnote || c.note || "—";
    $("asked").textContent = c.base_ru + (c.slot === "18" ? " · встанет в режим 18+" : " · встанет в обычный режим") +
                             (c.core ? " · модели сказано: " + c.core : "");
    $("note").value = c.pick_note;
    $("saved").textContent = c.pick ? pickRu(c.pick) + (c.pick_when ? " · " + c.pick_when : "") : "";
    return;
  }
  $("note").value = c.note;
  $("prompt").value = c.my_prompt || c.prompt;
  $("why").textContent = c.why;
  $("neg").textContent = c.neg ? "Негатив: " + c.neg + " · сила " + c.strength : "—";
  markStatus(c.status); markPrompt(c);
  $("saved").textContent = c.when ? "сохранено " + c.when : "";
}

function markStatus(s) { document.querySelectorAll(".st button").forEach(b => b.classList.toggle("on", s && b.dataset.s === s)); }
function markPrompt(c) { $("pstate").textContent = c.my_prompt ? "промпт изменён вами" : (c.prompt ? "исходный промпт pedia_batch" : ""); }

async function savePickNote() {
  const c = view[cur];
  if ($("note").value === c.pick_note) return;
  const note = $("note").value;
  try {
    const r = await fetch("/api/pick", { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify({ stem: c.stem, pick: c.pick, note }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    c.pick_note = note; c.pick_when = j.when;
    if (view[cur] === c) $("saved").textContent = "заметка сохранена " + j.when;
  } catch (e) { $("saved").textContent = "НЕ СОХРАНЕНО: " + e.message; }
}

async function save() {
  timer = null;
  if (cur < 0) return;
  if (ROUND) return savePickNote();
  const c = view[cur];
  const p = $("prompt").value.trim(), mine = p && p !== c.prompt.trim() ? p : "";
  const body = { stem: c.stem, status: c.status, note: $("note").value, prompt: mine };
  if (body.note === c.note && mine === c.my_prompt && !c._dirtyStatus) return;
  $("saved").textContent = "сохраняю…";
  try {
    const r = await fetch("/api/note", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    c.note = body.note; c.my_prompt = mine; c._dirtyStatus = false; c.when = j.when;
    if (view[cur] === c) { $("saved").textContent = "сохранено " + j.when; markPrompt(c); }
    const d = $("list").children[view.indexOf(c)];
    if (d) { d.className = "s-" + (c.status || "none") + (view[cur] === c ? " cur" : "");
             if (c.note.trim() && !d.querySelector(".n")) { const n = document.createElement("span"); n.className = "n"; n.textContent = "✎"; d.appendChild(n); } }
  } catch (e) { $("saved").textContent = "НЕ СОХРАНЕНО: " + e.message; }
}
function later() { clearTimeout(timer); timer = setTimeout(save, 700); $("saved").textContent = "…"; }
function flush() { if (timer) { clearTimeout(timer); save(); } }

$("note").addEventListener("input", later);
$("prompt").addEventListener("input", later);
document.querySelectorAll(".st button").forEach(b => b.onclick = () => {
  if (cur < 0) return; const c = view[cur]; c.status = b.dataset.s; c._dirtyStatus = true; markStatus(c.status); clearTimeout(timer); save();
});
$("reset").onclick = () => { if (cur < 0) return; $("prompt").value = view[cur].prompt; later(); };
$("prev").onclick = () => cur > 0 && show(cur - 1);
$("next").onclick = () => cur < view.length - 1 && show(cur + 1);
$("filter").onchange = () => { savePref("pnF" + ROUND, $("filter").value); applyFilter(true); };
$("q").oninput = () => applyFilter(true);
$("show18").onchange = () => { savePref("pn18", $("show18").checked ? "1" : "0"); show(cur); };
$("showEn").onchange = () => { savePref("pnEn", $("showEn").checked ? "1" : "0"); show(cur); };
$("zoom").onclick = () => $("zoom").style.display = "none";
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { $("zoom").style.display = "none"; return; }
  if (/^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowRight") { e.preventDefault(); $("next").click(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); $("prev").click(); }
});
window.addEventListener("beforeunload", flush);
window.addEventListener("hashchange", () => {
  const k = decodeURIComponent(location.hash.slice(1)).toLowerCase();
  if (cur >= 0 && view[cur].key === k) return;
  let i = view.findIndex(c => c.key === k);
  if (i < 0) { $("filter").value = "all"; $("q").value = ""; applyFilter(false); return; }
  show(i);
});

document.querySelectorAll(".round button[data-p]").forEach(b => b.onclick = () => pick(b.dataset.p));

// кандидаты круга дорисовываются очередью видеокарты: раз в минуту подтянуть новые, не трогая введённое
async function refreshCands() {
  try {
    const d = await (await fetch("/api/cards")).json();
    const by = Object.fromEntries(d.cards.map(c => [c.key, c]));
    cards.forEach(c => {
      const n = by[c.key]; if (!n || n.cands.length === c.cands.length) return;
      c.cands = n.cands;
      const i = view.indexOf(c);
      if (i === cur) renderPics(c);
      const el = $("list").children[i];
      if (el && !c.pick) { const m = el.querySelector(".n"); if (m) m.textContent = " ●" + c.cands.length; }
    });
  } catch (e) {}
}

fetch("/api/cards").then(r => r.json()).then(d => {
  ROUND = d.round;
  if (ROUND) {
    FILTERS = ROUND_FILTERS;
    document.body.classList.add("rd");
    document.title = "Перекрафт педии — " + ROUND;
    $("noteTitle").textContent = "Что не так с новыми — для следующего круга";
    $("note").placeholder = "Например: лицо всё ещё старое; бельё снова чёрное";
    setInterval(refreshCands, 60000);
  }
  FILTERS.forEach(f => { const o = document.createElement("option"); o.value = f[0]; o.textContent = f[1]; $("filter").appendChild(o); });
  loadPrefs();
  cards = d.cards; applyFilter(false);
}).catch(e => { $("name").textContent = "Сервер не ответил: " + e.message; });
</script>
</body>
</html>
