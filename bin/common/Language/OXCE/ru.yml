  STR_HD_MOD_OFF: "HD-арта для этой игры в активных модах нет: настройки подействуют, когда мод с ним включат в «Модах»."
  STR_HD_ART_VERSION: "Версия арта"
  STR_HD_ART_VERSION_DESC: "Оригинал — пиксели самой игры. HD — картинки мода HD. HD 18+ — HD с картинками без цензуры там, где они есть в моде."
  STR_HD_ART_MENU_ONLY: "Переключение между HD и HD 18+ перезагружает ресурсы и возможно только из главного меню."
  STR_HD_ART_ORIGINAL: "Оригинал"
  STR_HD_ART_HD: "HD"
  STR_HD_ART_ADULT: "HD 18+"
  STR_HD_ADULT_ASK: "Спрашивать версию арта при запуске"
  STR_HD_ADULT_ASK_DESC: "При каждом запуске игра спрашивает, играть с HD или с HD 18+. Выкл — без вопроса берётся версия, выбранная здесь."
  STR_HD_THREADS: "Потоки отрисовки"
  STR_HD_THREADS_DESC: "Сколько потоков процессора рисуют HD-поле боя. 0 — все, кроме двух. Действует после перезапуска."
  STR_HD_FRAME_SKIP: "Шаги догонки"
  STR_HD_FRAME_SKIP_DESC: "Если кадр рисуется медленнее, чем требуют настройки скорости юнитов, игра делает до стольких лишних шагов за кадр, чтобы юниты шли с заданной скоростью. 0 — один шаг на кадр. Только при масштабе поля боя 2–4."
  STR_HD_GPU: "Вывод через видеокарту"
  STR_HD_GPU_DESC: "Кадр выводит на экран видеокарта (OpenGL 3.3): растяжку до размера окна и копирование делает она, а не процессор. Если видеокарта или драйвер не справляются, игра сама вернётся к обычному выводу. Старый OpenGL-фильтр со своими шейдерами при этом не работает."
  STR_AUTO_NIGHT_VISION_THRESHOLD: "Порог активации ночного видения"
  STR_AUTO_NIGHT_VISION_THRESHOLD_DESC: "Если уровень освещенности ниже указанного порога, автоматически включать ночное видение."
  STR_SHOW_ACCURACY_ON_CROSSHAIR: "Отображать точность возле прицела"
  STR_SHOW_ACCURACY_ON_CROSSHAIR_DESC: "{ALT}0>{ALT}Никогда {ALT}1>{ALT}Только с формулой точности UFO Extender {ALT}{NEWLINE}2>{ALT}Всегда"
  STR_REACTION_FIRE_THRESHOLD: "Порог ответного выстрела"
  STR_REACTION_FIRE_THRESHOLD_DESC: "Боевые единицы под управлением игрока не будут открывать ответный огонь, если точность их выстрела по конкретной цели ниже указанного порога."
  STR_AUTO_SELL: "Менеджер автоматической продажи"
  STR_AUTO_SELL_DESC: "На экране продажи трофеев после боя любой предмет, который продавался после предыдущих боев, будет отмечен как продаваемый."
  STR_AUTOMATICPROMOTIONS: "Автоматическое повышение"
  STR_AUTOMATICPROMOTIONS_DESC: "При включении повышение бойцов происходит автоматически по завершении задания."
  STR_OFF_CENTRE_SHOOTING: "Стрельба со смещением"
  STR_OFF_CENTRE_SHOOTING_DESC: "Бойцы будут вести огонь, немного сдвигая угол стрельбы при отсутствии линии огня."
  STR_UNIFORM_SHOOTING_SPREAD: "Равномерный разброс выстрелов"
