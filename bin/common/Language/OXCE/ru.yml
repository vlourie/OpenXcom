  STR_HD_RETICLE_DAMAGE_COLOR: "Прицел цвета урона"
  STR_HD_RETICLE_DAMAGE_COLOR_DESC: "Жёлтый прицел на цели перекрашивается в цвет типа урона выстрела - тот же, которым мод пишет урон в педии (бронебойный, огонь, лазер, плазма и т. д.). У заряжаемого оружия берётся тип урона заряженного боеприпаса, у оружия со своим зарядом - его собственный, у удара - тип урона удара. Красный прицел без цели остаётся красным. Если мод цвета типам урона не задаёт (ванильный UFO), у каждого типа свой цвет, как у области поражения; у незаряженного оружия прицел обычный жёлтый. Выкл - всегда жёлтый."
  STR_HD_RETICLE_ARTILLERY: "HD-прицел: артиллерия"
  STR_HD_RETICLE_ARTILLERY_DESC: "Свой прицел для выстрела боеприпасом, который взрывается: гранатомёт, ракеты, пушка с разрывным снарядом. Смотрится по заряженному боеприпасу: та же баллиста с обычным зарядом целится основным прицелом, а с мини-нюкой - артиллерийским. Как основной - без отдельного прицела. Только в HD-режимах с паком прицелов."
  STR_HD_RETICLE_EXPLOSIVE: "HD-прицел: взрывчатка"
  STR_HD_RETICLE_EXPLOSIVE_DESC: "Свой прицел для броска того, что взрывается: гранаты, мины, бомбы. Вместо рамки броска на клетке рисуется выбранный прицел, значок броска остаётся. Курсор броска - как в игре. Только в HD-режимах с паком прицелов."
  STR_HD_RETICLE_SAME: "Как основной"
  STR_HD_RETICLE_THROW: "Курсор броска"
  STR_HD_AIM_ARC: "Дуга полёта"
  STR_HD_AIM_ARC_DESC: "Когда бросаете что-нибудь или стреляете из оружия, которое бьёт по дуге, от бойца к прицелу бежит пунктирная дуга - путь, которым полетит бросок без промаха. Если долететь нельзя (потолок, стена, слишком далеко), дуга красная и обрывается крестиком там, где её остановит препятствие: игра в этом случае скажет «бросить сюда нельзя». Пунктир цвета типа урона у взрывчатки, белый у прочего. Промах может увести бросок в сторону. Только в HD-режимах."
  STR_HD_AIM_SKILL_BONUS: "Бонус навыка у прицела"
  STR_HD_AIM_SKILL_BONUS_DESC: "Под прицелом плашка «+N» цвета типа урона: сколько силы удара добавляют навыки бойца (меткость, бросок, сила и т. д.) у оружия, урон которого от них растёт. Обычный с виду пистолет в руках мастера бьёт заметно сильнее - плашка это показывает. Считается так же, как в бою, до разброса урона. Нет плашки - навык урон не меняет. Только в HD-режимах."
  STR_HD_BLAST_AREA: "Область поражения"
  STR_HD_BLAST_AREA_DESC: "Пока вы целитесь взрывчаткой или бросаете гранату, пол, который накроет взрыв, заливается цветом его типа урона (фугас, огонь, дым, газ и т. д. - тем цветом, которым мод пишет этот урон в педии; в ванильном UFO у каждого типа свой цвет). Заливка гуще всего там, где взрыв сильнее (прозрачность 60%), и бледнеет к клеткам, где он сходит на нет; стены и перекрытия режут область так же, как в игре. Область показана так, будто выстрел лёг в прицел, и только на уже разведанных клетках. Только в HD-режимах."
  STR_HD_LAB: "Новые функции"
  STR_HD_LAB_PROMPT: "Капитан, для выдачи доступа к этим функциям введите пароль. Пароль можно вымолить у разработчика лично или попробовать подобрать. Других подсказок разработчик не оставил."
  STR_HD_LAB_PASSWORD: "Пароль:"
  STR_HD_LAB_WRONG: "Пароль не подошёл."
  STR_HD_LAB_LOCKED: "Закрыто паролем"
  STR_HD_LAB_LOCKED_DESC: "Функции на испытании. Нажмите, чтобы ввести пароль."
  STR_HD_LAB_ENTER: "Ввести"
  STR_HD_LAB_RELOCK: "Закрыть раздел"
  STR_HD_LAB_RELOCK_DESC: "Снова прячет новые функции, и они перестают действовать: карта боя не поворачивается. Чтобы открыть раздел, понадобится пароль."
  STR_HD_MAP_ROTATION: "Поворот карты боя"
  STR_HD_MAP_ROTATION_DESC: "Испытание: карта боя поворачивается на четверть оборота, в бою - клавишами [ и ]. Меняется только картинка: ход, обзор и стрельба те же. Новых рисунков пока нет: предметы на диагоналях, составные предметы и обратные стороны стен могут выглядеть неверно, мини-карта не поворачивается."
  STR_HD_MAP_ROTATION_0: "нет"
  STR_HD_MAP_ROTATION_1: "1/4"
  STR_HD_MAP_ROTATION_2: "1/2"
  STR_HD_MAP_ROTATION_3: "3/4"
