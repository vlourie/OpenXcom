  STR_GENTLE_CHOICE_TITLE: "ВНИМАНИЕ: СВЕТОЧУВСТВИТЕЛЬНОСТЬ"
  STR_GENTLE_CHOICE_INFO: "У небольшого числа людей мигающий свет, вспышки и быстрая смена картинки могут вызвать эпилептический приступ, даже если раньше приступов не было. Возможны также головная боль, головокружение, тошнота, нарушение зрения. Если вы почувствовали что-то подобное - прекратите игру и обратитесь к врачу.{NEWLINE}{NEWLINE}Нежный режим снижает число вспышек и резких движений, но не гарантирует защиту: приступ могут вызвать и мигание, и некоторые узоры на экране. На правила игры он не влияет. Изменить можно в Настройки > HD."
  STR_GENTLE_CHOICE_ON: "Включить нежный режим"
  STR_GENTLE_CHOICE_OFF: "Играть как обычно"
  STR_HD_GENTLE: "Нежный режим"
  STR_GENTLE_MODE: "Нежный режим"
  STR_GENTLE_MODE_DESC: "Меньше вспышек и резких движений. Для тех, кто чувствителен к мигающему свету: бойцы ходят и снаряды летят вдвое медленнее, камера не гонится за выстрелом, крупный план последнего удара выключен. Только картинка и темп: урон, ходы и случайные броски те же. Настройки, которые режим задаёт сам, серые с пометкой."
  STR_GENTLE_LOCKED: "(нежный режим)"
