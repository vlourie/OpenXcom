  STR_CRASHED_OR_LANDED: "Кнопка посадки/катастрофы"
  STR_CRASHED_OR_LANDED_DESC: "При активации на экране генератора миссий отображается дополнительная кнопка. Ее также можно отобразить/скрыть нажатием на F11. {ALT}0>{ALT}Отключена, {ALT}1>{ALT}Катастрофа, {ALT}2>{ALT}Посадка."
