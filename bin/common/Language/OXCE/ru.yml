  STR_HD_TAB_BATTLE: "Бой"
  STR_HD_TAB_INTERFACE: "Интерфейс"
  STR_HD_TAB_WORLD: "Глобус, база"
  STR_HD_TAB_AI: "ИИ, правила"
  STR_HD_TAB_SPEED: "Скорость"
  STR_HD_GRAPHICS: "Графика боя"
  STR_HD_BATTLE_UI: "Прицел и панель боя"
  STR_HD_GEOSCAPE: "Глобус"
  STR_HD_BASE: "База и корабли"
  STR_HD_UPDATE_NOTICE: "Плашка «Доступно обновление»"
  STR_HD_UPDATE_NOTICE_DESC: "Когда лаунчер видит новый выпуск, в левом верхнем углу игры появляется маленькая плашка «Доступно обновление» с его номером. Плашка пропадает, когда обновление установлено. Без лаунчера её не бывает. Выкл. - не показывать."
  STR_HD_CRAFT_FIT: "Экипаж корабля: серые строки и места"
  STR_HD_CRAFT_FIT_DESC: "На экране назначения экипажа бойцы, которым уже не хватает места на корабле (или упёрлись в предел корабля по числу бойцов и техники), показаны серыми строками, и окно «Не хватает места» не выскакивает. Правила назначения те же: щелчок по серой строке ничего не делает. Внизу кнопки «Сортировать по» и «Есть!» короче, а между ними плашка «занято/всего мест», например 12/14; её нельзя нажать. Выкл. - как было: окно и широкие кнопки."
  STR_HD_WOUNDED_RED: "Раненые красным"
  STR_HD_WOUNDED_RED_DESC: "На экране назначения экипажа и в списке бойцов базы имя раненого бойца и надпись «РАНЕНИЕ>дни» в его строке красные, чтобы раненых было видно сразу. Только цвет текста: кого можно взять на корабль или отправить учиться, не меняется. Выкл. - как было."
  STR_HD_CRAFT_MISSION: "Экипаж корабля: подсветка по миссии"
  STR_HD_CRAFT_MISSION_DESC: "На экране назначения экипажа под списком появляется выбор «Для миссии:» с найденными целями (места миссий, базы чужих, севшие или упавшие НЛО). Выберите цель, и имена бойцов, которые могут на неё лететь, станут зелёными, а строка над выбором скажет, сколько подходит, или чего не хватает судну (судно не допускается, нужен командир или предметы на борту); наведите мышь на бойца, чтобы увидеть, почему он не подходит. Проверка та же, что при посадке: судно и тип бойца из условия старта. Броня не запрет, она заменяется при старте. Только цвета и строка: порядок списка, щелчки и посадка не меняются. Пока включено, в списке 13 строк вместо 16. Выкл. - как было."
  STR_CRAFT_FOR_MISSION: "Для миссии:"
  STR_CRAFT_FOR_MISSION_NONE: "не выбрана"
  STR_CRAFT_MISSION_NO_CRAFT: "Это судно на миссию не допускается"
  STR_CRAFT_MISSION_NO_TYPE: "Этот тип бойца на миссию не допускается"
