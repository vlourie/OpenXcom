  STR_HD_FIRE_PACE: "Скорость огня"
  STR_HD_FIRE_PACE_DESC: "Как быстро идёт анимация огня на клетках в режимах HD-спрайтов, в процентах от исходной: меньше - каждая картинка держится дольше. Каждая клетка горит в своём темпе и со своего места петли, поэтому соседние клетки не мигают в такт. Только картинка, сам огонь тот же. Меняется сразу, прямо в бою."
  STR_HD_SMOKE_PACE: "Скорость дыма"
  STR_HD_SMOKE_PACE_DESC: "Как быстро клубится дым на клетках в режимах HD-спрайтов, в процентах от исходной: меньше - каждая картинка держится дольше. Каждая клетка дымит в своём темпе и со своего места петли, поэтому облако не движется в такт. Только картинка, сам дым тот же. Меняется сразу, прямо в бою."
