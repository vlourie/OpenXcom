  STR_HD_RETICLE: "HD-прицел"
  STR_HD_RETICLE_DESC: "Прицел в бою. Из пака - картинка самого HD-пака; Стоковый - прицел оригинальной игры, только увеличенный; Кольцо 45 - кольцо с метками по диагоналям и пустым центром; Плазма, Техно, Хищник - другие нарисованные стили; тонкие - те же стили тонкими линиями; Лазеры, Лазерный крест, Захват, Сходящиеся круги, Снайпер, Шевроны, Пунктир, Трилистник, Точка - лёгкие тонкие прицелы; Призрак - почти прозрачный, видна только бегущая искра. Меняется сразу, прямо в бою."
