  STR_HD_FIRE: "HD-огонь"
  STR_HD_FIRE_DESC: "Как выглядит огонь на клетках и на горящих бойцах в режимах HD-спрайтов. Прежний - рисованный огонь прошлых выпусков; Объёмный - настоящее пламя со слоями языков; Объёмный, вверх - то же, языки бегут вверх; Ровный, вверх - одна картинка пламени, которая только лижет вверх. Только картинка, сам огонь тот же. Меняется сразу, прямо в бою."
