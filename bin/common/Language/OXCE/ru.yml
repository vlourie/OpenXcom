  STR_LAZY_LOADING: "Ленивая загрузка"
  STR_LAZY_LOADING_DESC: "При включении графические ресурсы подгружаются по мере необходимости. В противном случае они загружаются при запуске приложения."
  STR_VSYNC_FOR_OPENGL: "Верт. синхронизация в OpenGL"
  STR_VSYNC_FOR_OPENGL_DESC: "При выключении ускоряет скрытые перемещения противника, а также (в зав. от настроек) перемещение бойцов. НЕ РЕКОМЕНДУЕТСЯ ограничение к/с, равное 0. Только для OpenGL-рендера."
  STR_UPDATE_CHECK: "Автопроверка обновлений"
  STR_UPDATE_CHECK_DESC: "При включении опции OpenXcom автоматически проверяет наличие обновлений и позволяет обновить игру автоматически одним нажатием на кнопку."
  STR_AUTOSAVE_SLOTS: "Слоты автосохранения"
  STR_AUTOSAVE_SLOTS_DESC: "Количество слотов автосохранения в тактическом режиме."
  STR_AUTO_SAVE_BATTLESCAPE_SLOT_WITH_NUMBER: "{0}"
  STR_GEO_AUTOSAVE_FREQUENCY: "Частота автосохранения (в страт. режиме)"
  STR_GEO_AUTOSAVE_FREQUENCY_DESC: "Количество игровых дней, по истечении которых игра будет автоматически сохранена."
  STR_GEO_AUTOSAVE_SLOTS: "Число автосохранений (в страт. режиме)"
  STR_GEO_AUTOSAVE_SLOTS_DESC: "Количество доступных слотов под циклические автосохранения в стратегическом режиме."
  STR_AUTO_SAVE_GEOSCAPE_SLOT_WITH_NUMBER: "<AUTO GEOSCAPE> {0}"
  STR_OXCE_LINKS: "Дополнительные кнопки"
  STR_OXCE_LINKS_DESC: "Дополнительные меню / кнопки / элементы навигации, упрощающие доступ к новым возможностям, внедренным в OXCE."
  STR_PEDIA_SHOW_CLIP_SIZE: "Отображать количество боеприпасов в магазине в Уфопедии"
  STR_PEDIA_SHOW_CLIP_SIZE_DESC: "При включении на страницах Уфопедии будет отображаться количество боеприпасов, содержащихся в выстреле / обойме / магазине / ленте / коробке / батарее."
  STR_INTERCEPT_TABLE_SIZE: "Размер окна перехвата"
  STR_INTERCEPT_TABLE_SIZE_DESC: "Количество строк в следующих диалоговых окнах: «Перехват», «Наблюдение за НЛО»."
  STR_SHOW_SLACKING_INDICATOR: "Показывать бездействующих работников"
  STR_SHOW_SLACKING_INDICATOR_DESC: "При включении в интерфейсе отображается количество незадействованных ученых и инженеров."
  STR_SHOW_MAINTENANCE_TIME: "Отображать время обслуживания ТС"
  STR_SHOW_MAINTENANCE_TIME_DESC: "{ALT}0>{ALT} Не отображать {ALT}1>{ALT} Отображать только текущую операцию {ALT}{NEWLINE}2>{ALT} Отображать всё (ремонт + пополнение БК + заправка)."
  STR_CRAFT_WEAPON_ICONS: "Значки подвески перед именем судна"
  STR_CRAFT_WEAPON_ICONS_DESC: "Перед именем судна - значки установленного оружия и оборудования, как на экране судна: в списке перехвата и в списке судов базы."
  STR_HD_SCROLL_SPLIT: "Инвентарь: кнопка листания пополам"
  STR_HD_SCROLL_SPLIT_DESC: "В инвентаре боя кнопка листания земли («Под килем N/M») рисуется двумя половинками: стрелка влево и стрелка вправо. Щелчок по левой половине листает землю назад, по правой - вперёд (как правый щелчок и Shift + щелчок раньше). Колесо, клавиши и правый щелчок работают как прежде. Только вид кнопки и место щелчка. Выкл. - как было: одна стрелка вправо."
  STR_HD_MANUFACTURE_TOP: "Новое производство - наверх списка"
  STR_HD_MANUFACTURE_TOP_DESC: "Новое задание в мастерской встаёт первым в списке производства базы, а не последним, и стрелками его двигать не нужно. Осторожно: порядок в списке влияет на игру - задания идут сверху вниз, и когда денег или материалов на всех не хватает, первыми их получают верхние. Новое задание окажется впереди старых и заберёт своё раньше них. Так же будет, если вы сами поднимете его стрелками. Выкл. - как было: новое задание внизу."
  STR_HD_FUNDS_TOGGLE: "Щелчок по деньгам: деньги или рейтинг"
  STR_HD_FUNDS_TOGGLE_DESC: "Для «Показывать финансы» (Настройки, Геоскейп). Щелчок по строке денег на боковой панели геоскейпа показывает вместо денег текущий рейтинг - тот, что подводит ежемесячный отчёт, - а следующий щелчок возвращает деньги. Выбор помнится, пока игра не закрыта. Только показ: рейтинг и деньги считаются как всегда. Выкл. - как было: щелчок по деньгам ничего не делает."
  STR_HD_CRAFT_WEAPON_TOGGLE: "Значки подвески: красные выключенные и щелчок"
  STR_HD_CRAFT_WEAPON_TOGGLE_DESC: "Для «Значки подвески перед именем судна». Значок выключенного оружия красный, а щелчок по значку в списке перехвата и в списке судов базы включает или выключает это оружие - то же выключение, что щелчком по названию оружия в окне судна. Выключенное оружие не берётся в бой, пока его не включить. Выкл. - как было: значки без отметки, щелчок по строке действует как раньше."
  STR_DOGFIGHT_HIT_CHANCE: "Шансы попадания в окне перехвата"
  STR_DOGFIGHT_HIT_CHANCE_DESC: "Рядом с каждым орудием судна - его шанс попасть по НЛО, над радаром - шанс НЛО попасть по судну. Учтены пилоты, точность орудия, размер НЛО и бонусы обоих кораблей. Прочерк - в выбранном режиме орудие стрелять не будет (не достаёт, нет зарядов, выключено). Если НЛО ещё не изучено, его собственные бонусы не учтены и к числу добавлен ?, шанс НЛО - ?."
  STR_SHOW_ETA: "Отобр. расчетное время прибытия (РВП)"
  STR_SHOW_ETA_DESC: "{ALT}0>{ALT} Не отображать {ALT}1>{ALT} Отображать только для статичных целей {ALT}{NEWLINE}2>{ALT} Отображать также для движущихся целей."
  STR_UFO_LANDING_ALERT: "Предупреждение о приземлении НЛО"
  STR_UFO_LANDING_ALERT_DESC: "При включении отображается сообщение о приземлении замеченного НЛО."
  STR_REMEMBER_DISABLED_CRAFT_WEAPONS: "Запоминать отключенные вооружения ТС"
  STR_REMEMBER_DISABLED_CRAFT_WEAPONS_DESC: "Отключенные во время боя вооружения ТС будут оставаться отключенными. Их боекомплект также не будет пополняться на базе."
  STR_GEO_EVENT_INSTANT_DELIVERY: "Мгновенная доставка после событий"
  STR_GEO_EVENT_INSTANT_DELIVERY_DESC: "При включении любые предметы, сгенерировавшиеся в результате событий на стратегической карте, мгновенно оказываются на складе. При отключении они приходят на склад через 1 час."
  STR_SHOW_BASE_NAME_IN_POPUPS: "Название базы во всплывающих окнах"
  STR_SHOW_BASE_NAME_IN_POPUPS_DESC: "При включении название базы отображается в соответствующих всплывающих окнах (например, в окне «Исследование завершено»)."
  STR_ALTERNATE_CRAFT_EQUIPMENT_MANAGEMENT: "Изменение менеджмента груз. отсека ТС"
  STR_ALTERNATE_CRAFT_EQUIPMENT_MANAGEMENT_DESC: "При включении опции перемещение бойцов с базы на корабль и наоборот переносит их снаряжение вместе с ними (если это возможно)."
  STR_BASE_INFO_SCALE: "Масшт. полосы прокрутки на экране базы"
  STR_BASE_INFO_SCALE_DESC: "При включении полосы прокрутки шириной более 140 пикселей масштабируются под размеры элементов интерфейса."
  STR_HIGHLIGHT_NEW: "Подсвечивать новые топики"
  STR_HIGHLIGHT_NEW_DESC: "При включении новые исследования, позиции в каталоге производства и статьи Уфопедии подсвечиваются другим цветом."
  STR_RESEARCH_SCROLL_SPEED: "Скорость прокрутки исследований"
  STR_RESEARCH_SCROLL_SPEED_DESC: "Позволяет назначать/снимать ученых на экране текущих исследований средней кнопкой мыши."
  STR_RESEARCH_SCROLL_SPEED_CTRL: "Скорость прокрутки исследований (с Ctrl)"
  STR_RESEARCH_SCROLL_SPEED_CTRL_DESC: "Позволяет назначать/снимать ученых на экране текущих исследований средней кнопкой мыши."
  STR_MANUFACTURE_FILTER_SUPPLIES_OK: "Фильтр каталога производства"
  STR_MANUFACTURE_FILTER_SUPPLIES_OK_DESC: "При включении в списке производства отображаются только те позиции, для которых есть сырье."
  STR_MANUFACTURE_SCROLL_SPEED: "Скорость прокрутки каталога производства"
  STR_MANUFACTURE_SCROLL_SPEED_DESC: "Позволяет назначать/снимать инженеров на экране производства с помощью средней кнопки мыши."
  STR_MANUFACTURE_SCROLL_SPEED_CTRL: "Скорость прокрутки каталога производства (с Ctrl)"
  STR_MANUFACTURE_SCROLL_SPEED_CTRL_DESC: "Позволяет назначать/снимать инженеров на экране производства с помощью средней кнопки мыши."
  STR_PERSONAL_LAYOUT_INCLUDING_ARMOR: "Бронезащита в личном снаряжении"
  STR_PERSONAL_LAYOUT_INCLUDING_ARMOR_DESC: "При включении личное снаряжение бойцов сохраняется вместе с надетой бронезащитой."
  STR_MANUALPROMOTIONS: "Повышение игроком"
  STR_MANUALPROMOTIONS_DESC: "При включении опции повышение (или понижение) бойцов осуществляется вручную при нажатии на иконку звания."
  STR_SOLDIER_GROUP_BY: "Группировать бойцов"
  STR_SOLDIER_GROUP_BY_DESC: "Сортировка списка бойцов сначала раскладывает их по группам, а внутри группы - по выбранному параметру. 0 - без групп, 1 - по расе, 2 - по званию, 3 - по посудине."
  STR_SOLDIER_TYPE_ICON: "Картинки расы и звания в списке бойцов"
  STR_SOLDIER_TYPE_ICON_DESC: "Перед именем бойца - картинка его расы, как на экране бойца, перед званием - значок звания."
  STR_TRANSFER_EXCHANGE: "Обмен в обе стороны на экране транспортировки"
  STR_TRANSFER_EXCHANGE_DESC: "Обе базы отправляют сразу: стрелка влево двигает к первой базе, стрелка вправо - ко второй, а в столбцах видно, сколько у каждой базы станет. Место на базе считается с учётом того, что она сама отправляет."
  STR_TRANSFER_EXCHANGE_TITLE: "ОБМЕН"
  STR_TRANSFER_EXCHANGE_AMOUNT: "Обмен"
  STR_TRADE_CONFIRM: "Закупка и продажа: подтверждать от стольких строк"
  STR_TRADE_CONFIRM_DESC: "Перед сделкой на экранах закупки и продажи показывать окно со списком выбранного и итоговой суммой, если выбрано столько строк или больше. 1 - спрашивать всегда, 0 - никогда."
  STR_TRADE_STAY: "Закупка и продажа: оставаться на экране после сделки"
  STR_TRADE_STAY_DESC: "После сделки экран закупки или продажи открывается заново на той же базе, с той же категорией и прокруткой - стрелками можно сразу перейти к другой базе. Выход - кнопкой отмены. Экраны после боя и при переполнении склада закрываются, как раньше."
  STR_TRADE_CONFIRM_BUY: "ПОДТВЕРДИТЬ ЗАКУПКУ"
  STR_TRADE_CONFIRM_SELL: "ПОДТВЕРДИТЬ ПРОДАЖУ"
  STR_TRADE_CONFIRM_TOTAL: "Итого: {0}"
  STR_INVENTORY_USE_ON_BODY: "Инвентарь в бою: применить, бросив на бойца"
  STR_INVENTORY_USE_ON_BODY_DESC: "Аптечку, еду или таблетки, брошенные на фигуру бойца в инвентаре, он берёт в свободную руку и применяет на себе: аптечка открывает своё окно лечения, еда и таблетки уходят сразу, многоразовое остаётся в руке. ОД - как если взять в руку и применить из меню действия. Руки заняты или ОД не хватает - игра скажет."
  STR_INV_USE_NOT_ON_SELF: "Это на себе не применить"
  STR_INV_USE_FREE_A_HAND: "Освободи руку, чтобы применить"
  STR_INV_USE_NOT_SO_FAST: "Не торопись: не хватит ОД взять в руку и применить"
  STR_CATCH_THROWN: "Бой: боец ловит брошенное своим"
  STR_CATCH_THROWN_DESC: "Вкл — предмет, который боец бросил своему товарищу и который упал точно на его клетку, тот сразу берёт в свободную руку (сначала в правую, потом в левую) и платит столько ОД, сколько стоит взять предмет с земли в руку в инвентаре. Только в ход игрока. Нет свободной руки или не хватает ОД — предмет лежит на земле, как обычно. Предмет со взведённым запалом не ловят. Выкл — как было."
  STR_MANUFACTURE_DELIVERY: "Мастерская: поставка на другие базы"
  STR_MANUFACTURE_DELIVERY_DESC: "Вкл — на экране заказа мастерской (обычные предметы, не корабли, не случайные наборы, не люди, не бесконечный заказ и не продажа) появляется кнопка «Поставка»: выберите другую базу и сколько единиц заказа отправить на неё; можно на несколько баз, всего не больше заказанного. Когда весь заказ готов, доли берутся со склада (не больше, чем там есть) и идут обычной перевозкой: время и цена как у перевозки между базами, цена списывается при отправке. Не хватает денег на долю — она остаётся на складе. В сообщении о завершении сказано, сколько и куда ушло; нет места на принимающей базе — об этом тоже, но товар всё равно в пути. Отмена заказа, нехватка денег или материалов до конца — ничего не отправляется. В окне выбора количества написано, что именно уйдёт на базу. Кнопка «План поставок» на экране заказа открывает список поставок по плану всех заказов базы: щелчок по строке убирает поставку (уже отправленное в пути не трогается). В окне о завершении производства (обычные предметы) появляется кнопка «Переслать хабар»: выберите базу и сколько из только что сделанного отправить, как обычной перевозкой, цена списывается при отправке; после отправки вы в том же окне и можете переслать остаток на другую базу. Выкл — кнопки нет, всё как было."
  STR_DELIVERY: "ПОСТАВКА"
  STR_DELIVERY_TITLE: "Поставка: базы"
  STR_DELIVERY_AMOUNT: "Сколько отправить на базу {0}?"
  STR_DELIVERY_RESERVED: "В поставку: {0} из {1}"
  STR_DELIVERY_RESERVED_PIECES: "В поставку: {0} из {1} шт."
  STR_DELIVERY_FULLY_RESERVED: "Зарезервировано полностью"
  STR_DELIVERY_SENT: "Отправлено: {0}"
  STR_DELIVERY_NO_SPACE: "Кэп, там нет места, но товар в пути: {0}"
  STR_DELIVERY_KEPT: "Не хватило денег на перевозку, осталось на складе: {0}"
  STR_LOOT_SHIP: "Переслать хабар"
  STR_LOOT_TITLE: "Хабар: базы"
  STR_LOOT_LEFT: "Хабар на складе: {0}"
  STR_LOOT_SENT: "Переслано хабара: {0}"
  STR_LOOT_PARTS_TOTAL: "Уйдёт штук: {0}"
  STR_DELIVERY_ON_BASE: "На базе"
  STR_DELIVERY_WILL_GO: "Уйдёт: {0} -> {1}"
  STR_DELIVERY_NONE: "На базу {0} ничего не уйдёт"
  STR_DELIVERY_ITEM_QTY: "{0} x{1}"
  STR_DELIVERY_CANCEL: "ПЛАН ПОСТАВОК"
  STR_DELIVERY_PLAN_TITLE: "Поставки по плану"
  STR_DELIVERY_PLAN_HINT: "Щелчок по строке убирает поставку из плана"
  STR_DELIVERY_PLAN_EMPTY: "Поставок в плане нет"
  STR_DELIVERY_PLAN_WHAT: "Что уйдёт"
  STR_DELIVERY_PLAN_WHERE: "Куда"
  STR_WOUNDED_DEFEND_BASE_IF: "Раненые в обороне (если ОЗ больше %)"
  STR_WOUNDED_DEFEND_BASE_IF_DESC: "Раненые бойцы принимают участие в обороне базы, если их ОЗ выше указанного процента."
  STR_PLAY_BRIEFING_MUSIC_DURING_EQUIPMENT: "Продлевать воспроизв. трека брифинга"
  STR_PLAY_BRIEFING_MUSIC_DURING_EQUIPMENT_DESC: "Музыка из брифинга будет воспроизводиться во время снаряжения бойцов, пока не отобразится поле боя."
  STR_NIGHT_VISION_COLOR: "Цвет ночного видения"
  STR_NIGHT_VISION_COLOR_DESC: "Диапазон значений от 1 до 15, каждое из которых соответствует определенному оттенку."
  STR_HD_SCALE: "Масштаб поля боя (HD)"
  STR_HD_SCALE_DESC: "1 — классические тайлы 32×40. 2–4 — поле боя рисуется во столько раз крупнее (нужен OpenGL или 32-битный фильтр; действует со следующего боя). Спрайты без HD-версии движок увеличивает сам."
  STR_HD_MODE: "HD-спрайты"
  STR_HD_MODE_DESC: "0 — классические пиксели, 1 — HD-паки модов (папка hd/), 2 — HD-паки + сглаживание xBRZ всего остального. В бою переключается клавишей F11."
  STR_HD_LIGHT: "HD-свет"
  STR_HD_LIGHT_DESC: "В режимах HD-спрайтов: свет плавно переходит между тайлами и имеет цвет (холодный ночью, тёплый от огня и ламп). На правила видимости в игре не влияет."
  STR_HD_GROUND_VARIANTS: "HD-варианты земли"
  STR_HD_GROUND_VARIANTS_DESC: "В режимах HD-спрайтов: если в HD-паке мода у пола есть несколько картинок (<индекс>.v1.png и далее), они раскладываются по карте плавными пятнами с рваными смешанными краями — поле из одной клетки перестаёт выглядеть сеткой. Выкл — везде основная картинка пака."
  STR_HD_UNIT_SHADOW: "HD-тень под юнитами"
  STR_HD_UNIT_SHADOW_DESC: "В режимах HD-спрайтов: под каждым видимым юнитом, который на чём-то стоит, на полу лежит мягкая тень; она идёт за юнитом по шагу и поднимается вместе с местностью. Под летящим тень ложится на пол ниже, до трёх уровней вниз, и чем выше, тем она слабее и шире. Только картинка: на правила видимости в игре не влияет."
  STR_HD_FLOOR_AO: "HD-затенение углов"
  STR_HD_FLOOR_AO_DESC: "В режимах HD-спрайтов: пол мягко темнеет у стен, ящиков и всего, что на нём стоит, как в углах комнаты. Берётся из формы увиденных игроком частей карты; низкие обломки затеняют слабее. Только картинка: на видимость и правила игры не влияет."
  STR_HD_ITEM_SHADOW: "HD-тень предметов"
  STR_HD_ITEM_SHADOW_DESC: "В режимах HD-спрайтов: под каждым предметом на полу - оружием, добычей, телами - лежит мягкая тень. Строится по картинке самого предмета. Только картинка: на видимость и правила игры не влияет."
  STR_HD_FLASH_LIGHT: "HD-свет вспышек"
  STR_HD_FLASH_LIGHT_DESC: "В режимах HD-спрайтов с HD-светом и HD-эффектами: взрывы, попадания и вспышки выстрелов освещают пол, стены и бойцов вокруг - цветом и силой самой вспышки; стены отбрасывают от неё тень, свет не проходит сквозь них. Заметнее всего ночью: днём светлее уже не станет. Только картинка: на видимость и правила игры не влияет."
  STR_HD_VOLUME_SMOKE: "HD-дым клубами"
  STR_HD_VOLUME_SMOKE_DESC: "В режимах HD-спрайтов дым на клетке - не плоское пятно, а объёмные клубы: каждый рождается в своём месте, поднимается, растёт и тает, освещён светом клетки там, где плывёт (и вспышками, если включён HD-свет вспышек); над огнём поднимается тёмная копоть. Под ночным зрением и под водой - прежний дым. Только картинка: на видимость и правила игры не влияет."
  STR_HD_VOLUME_FIRE: "HD-огонь языками"
  STR_HD_VOLUME_FIRE_DESC: "В режимах HD-спрайтов огонь на клетке собирается из отдельных языков пламени в стиле пака, тёмно-красных по краю и ярко-жёлтых внутри: каждый вырастает, извивается, теряет кончик и гаснет, а следующий поднимается в другом месте, поэтому две горящие клетки и два момента не бывают одинаковыми. Под ночным зрением и под водой - прежний огонь. Только картинка: на распространение огня и правила игры не влияет."
  STR_HD_HOVER_BOB: "HD-покачивание юнитов"
  STR_HD_HOVER_BOB_DESC: "В режимах HD-спрайтов: летающие юниты, под которыми нет пола, плавно покачиваются вверх-вниз; покачивание нарастает при взлёте и стихает при посадке. Только картинка, клетка юнита не меняется. Выкл (и режим 0) — висят неподвижно, как в классике."
  STR_HD_WALKER_TURN: "HD-перетаптывание шагоходов"
  STR_HD_WALKER_TURN_DESC: "В режимах HD-спрайтов: шагоход (секторопод, жнец, росомаха и им подобные), который разворачивается на месте, перетаптывается кадрами ходьбы, а не показывает один кадр, повёрнутый на новую сторону. Новых кадров нет, ход, поворот и очки действий не меняются: только картинка. Выкл (и режим 0) — один кадр на каждую сторону, как в классике."
  STR_HD_FX: "HD-эффекты боя"
  STR_HD_FX_DESC: "В режимах HD-спрайтов: попадания, удары и взрывы рисуются эффектами HD-мода — по оружию, цели и грунту, а у стволов появляется вспышка выстрела. Только картинка, время и урон те же. Выкл (и режим 0) — классические анимации."
  STR_HD_BLOOD_SPRAY: "Брызги крови по полёту пули"
  STR_HD_BLOOD_SPRAY_DESC: "Вкл — при попадании пули, дроби или луча, из-за которого боец потерял здоровье, кровь летит дальше по ходу выстрела, а не во все стороны поровну; чем больше доля здоровья потеряна, тем гуще брызги, и вид брызг выбирается из нескольких по самому попаданию. Если броня удар выдержала или здоровье не убыло (оглушение), кровь рисуется как обычно. Работает только в режимах HD-спрайтов и при включённых «HD-эффектах боя». Только картинка: время анимации, урон и ход боя те же. Выкл — кровь как раньше."
  STR_HD_BLOOD_COLOR: "Цвет крови по виду существа"
  STR_HD_BLOOD_COLOR_DESC: "Вкл — кровь при попадании по существу рисуется цветом, который таблица мода hd/blood.txt задаёт его броне (таблица Пираток: зомби — охра зелёная, глубоководные — небесно-голубой, огры и уберы — тёмно-красный, техника — графитовый), а не красным; меняется тон, яркость брызг остаётся. Существа, которых в таблице нет, остаются с красной кровью, а машина, по которой видны искры, сохраняет их. Работает только в режимах HD-спрайтов и при включённых «HD-эффектах боя». Только картинка: время анимации, урон и ход боя те же. Выкл — красная кровь как раньше."
  STR_HD_BLOOD_STEPS: "Кровавые следы шагов"
  STR_HD_BLOOD_STEPS_DESC: "Вкл — боец, наступивший на клетку, где истекает кровью другой (живой, с тяжёлыми ранами, стоящий или лежащий без сознания; не труп), оставляет кровавые отпечатки подошв на следующих двух клетках пути, повёрнутые по ходу шага, цветом крови раненого (красным, а при включённом «Цвете крови по виду существа» — его цветом). Следы гаснут за три хода. Летящие и парящие следов не оставляют, на воде, лаве и там, где нет пола, следов нет. Следы оставляет только тот, кого игрок видит, и рисуются они только на разведанном полу. Следы появляются только от новых шагов: после загрузки сейва старых нет. Работает только в режимах HD-спрайтов. Только картинка: сейв, порядок хода, видимость и правила игры не затронуты. Выкл — как раньше."
  STR_HD_KILLCAM: "Последний удар крупным планом"
  STR_HD_KILLCAM_DESC: "Когда последний враг падает от выстрела или удара, камера наезжает на него, падение плавно замедляется, тело лежит мгновение, и камера отъезжает — всего около четырёх секунд. Только картинка и темп: урон, ходы и случайные броски те же. Клавиша или щелчок — пропустить. Нужен 32-битный вывод."
  STR_HD_QUICK_FLIGHT: "Быстрый полёт пули"
  STR_HD_QUICK_FLIGHT_DESC: "Дальний выстрел долетает примерно за треть секунды, ближний летит как раньше. Путь пули, попадание и урон те же: пуля лишь быстрее проходит тот же путь. В нежном режиме выключено."
  STR_HD_LOOSE_HITS: "Очередь без пауз на попаданиях"
  STR_HD_LOOSE_HITS_DESC: "Вспышка попадания доигрывает сама, а следующая пуля очереди вылетает, не дожидаясь её. Урон и потери считаются в том же порядке, что и раньше; погибшая цель падает до следующего выстрела. Ближний бой и пси — как раньше. В нежном режиме выключено."
  STR_HD_ENEMY_NUMBER: "Цифры над противником"
  STR_HD_ENEMY_NUMBER_DESC: "Номер над врагом, которого выбранный боец видит сам, — тот же, что на красной кнопке справа на панели. Нет — номеров над врагами нет, кнопки остаются. Мигают — номер переливается вместе с кнопкой. Не мигают — номер горит ровным красным."
  STR_HD_ENEMY_NUMBER_0: "Нет"
  STR_HD_ENEMY_NUMBER_1: "Мигают"
  STR_HD_ENEMY_NUMBER_2: "Не мигают"
  STR_HD_PICTURES: "HD-картинки"
  STR_HD_PICTURES_DESC: "Картинки интерфейса, которые моды кладут в hd/UI (иллюстрации уфопедии, экраны), показываются в разрешении дисплея вместо 8-битных оригиналов; остальной интерфейс не меняется. Нужен 32-битный вывод (OpenGL или 32-битный фильтр)."
  STR_HD_BACKDROP: "Градиент за краем карты"
  STR_HD_BACKDROP_DESC: "Вкл — пустота за краем карты боя заливается мягким вертикальным градиентом (вверху чуть темнее, внизу светлая дымка) вокруг цвета местности (по таблице мода hd/backdrop.txt; нет строки - цвет фона среды) вместо одного сплошного цвета. Выкл — один сплошной цвет, как было. Только картинка."
  STR_HD_BEYOND_EDGE: "Местность за краем карты"
  STR_HD_BEYOND_EDGE_DESC: "Вкл (только HD-масштаб больше 1) — за краем карты боя местность продолжается зеркалом края: полы краевых клеток отражаются через край на глубину до 36 клеток и тонут в цвете фона по мере удаления (пол, которого вы ещё не открыли, показывается самым частым полом края). Не в вакууме и не в повёрнутом виде. Выкл — пустота, как было. Только картинка: в бою ничего не меняется, по этим клеткам нельзя щёлкнуть."
  STR_HD_BEYOND_LOOK: "Вид местности за краем"
  STR_HD_BEYOND_LOOK_DESC: "Как выглядит местность за краем карты (работает при включённой «Местности за краем карты»; HD-масштаб больше 1). Как есть — полы своих цветов, тонущие в цвете фона. Чёрно-белое — полы за краем в оттенках серого, настоящая карта выделяется. Туман — светлая дымка вместо цвета фона: полы тонут в ней, а сама дымка редеет до фона. Только картинка."
  STR_HD_BEYOND_LOOK_0: "Как есть"
  STR_HD_BEYOND_LOOK_1: "Чёрно-белое"
  STR_HD_BEYOND_LOOK_2: "Туман"
  STR_HD_MAP_BORDER: "Граница поля боя"
  STR_HD_MAP_BORDER_DESC: "Отмечает край карты боя по всему периметру (HD-масштаб больше 1; работает и без местности за краем; не в повёрнутом виде). Выкл — ничего. Линия — полоса в несколько пикселей сразу за краем, на уровне земли, цвета темы панели боя (тёплый жёлтый, если HD-интерфейс выключен). Забор — полупрозрачный красный забор высотой в один уровень по краю, как в XCOM 2. Только картинка: в бою ничего не меняется, по этим клеткам нельзя щёлкнуть."
  STR_HD_MAP_BORDER_0: "Выкл"
  STR_HD_MAP_BORDER_1: "Линия"
  STR_HD_MAP_BORDER_2: "Забор"
  STR_HD_HIDDEN_MAP: "Карта в ход невидимого врага"
  STR_HD_HIDDEN_MAP_DESC: "Пока ходит враг, которого не видно, вместо экрана «Скрытое движение» остаётся карта с камерой там, где она была. Видно только то, что видят ваши бойцы: невидимый враг, его выстрелы и взрывы вне обзора не показываются, камера за ним не ходит. Как только враг попадает на глаза — переключение на него, как раньше. Выкл — экран «Скрытое движение». Только картинка."
  STR_HD_ANIM_HIDDEN: "Анимация в ход врага и в меню"
  STR_HD_ANIM_HIDDEN_DESC: "Дым, огонь и лампы на карте боя не замирают там, где их останавливает классическая игра: пока боец идёт или стреляет, пока открыто меню выбора атаки и в ход невидимого врага — пока не изменилось ничего из открытого вами, но невидимого сейчас (дверь, дым, огонь, предмет или свет вне обзора); тогда картинка стоит, как раньше. Выкл — как в классике. Только картинка."
  STR_HD_PEDIA_RANGE: "Пиратопедия: дальность режимов оружия"
  STR_HD_PEDIA_RANGE_DESC: "В статье оружия у таблицы режимов появляется колонка «Дальн.» — дальность каждого режима в клетках (не больше предельной дальности оружия), заголовки колонок короче. У ближнего боя клетка пустая. Выкл — прежняя таблица."
  STR_HD_PEDIA_ACCURACY: "ТОЧН."
  STR_HD_PEDIA_TU: "ОД"
  STR_HD_PEDIA_RANGE_COLUMN: "ДАЛЬН."
  STR_HD_UI_SMOOTH: "HD-картинки: сглаженный интерфейс"
  STR_HD_UI_SMOOTH_DESC: "При включённых HD-картинках классический интерфейс масштабируется к дисплею через xBRZ (вид фильтра xBRZ) поверх картинок. Выкл — обычное (ступенчатое) масштабирование."
  STR_HD_BASE_ANIM: "Анимация построек базы"
  STR_HD_BASE_ANIM_DESC: "HD-постройки на экране базы оживают: мигают огни, крутятся механизмы, бурлят котлы. Выкл — постройки прежние, классические, без HD-картинок. Вступает в силу после перезапуска игры."
  STR_HD_CRAFT_LIGHTS: "Анимация кораблей"
  STR_HD_CRAFT_LIGHTS_DESC: "Огни кораблей в ангарах и на экране корабля мигают, а у анимированных кораблей идут фазы картинки. Выкл — корабли без огней и неподвижны."
  STR_HD_CRAFT_LAUNCH: "Вылет корабля"
  STR_HD_CRAFT_LAUNCH_DESC: "Когда корабль отправляют, камера опускается к его ангару, там звучит тревога, и короткий ролик показывает, как он выходит; при посадке — то же в обратную сторону. Любая клавиша или щелчок — пропустить. Только у кораблей, для которых есть ролик: пока Боевой танк, Драккар и Злая птичка."
  STR_HD_CRAFT_LAUNCH_0: "Выкл"
  STR_HD_CRAFT_LAUNCH_1: "С бойцами на борту"
  STR_HD_CRAFT_LAUNCH_2: "Все корабли"
  STR_HD_ALT_INFO: "Как с Alt - всегда"
  STR_HD_ALT_INFO_DESC: "В бою показывать без зажатого Alt то, что показывает Alt: куда смотрят бойцы и враги, урон и сила пси в прицеле. Ничего нового не открывает - только то, что и так видно по Alt."
  STR_HD_ALT_INFO_0: "Выкл"
  STR_HD_ALT_INFO_1: "Взгляд"
  STR_HD_ALT_INFO_2: "Урон и пси"
  STR_HD_ALT_INFO_3: "Всё"
  STR_HD_AMMO_HINT: "Подсвечивать подходящие патроны"
  STR_HD_AMMO_HINT_DESC: "Наведи курсор на оружие - подходящие к нему боеприпасы подсветятся: в инвентаре боя (и в куче на земле), в экипировке корабля и на складе базы. Ничего не меняется - это только подсказка."
  STR_HD_TRANSFER_COST: "Цена перевозки у кнопок"
  STR_HD_TRANSFER_COST_DESC: "На экране перевозки кнопки короче, а между ними цена перевозки - меняется сразу, пока выбираешь грузы."
  STR_HD_TRANSFER_CONFIRM: "Подтверждать перевозку"
  STR_HD_TRANSFER_CONFIRM_DESC: "Перед отправкой спрашивать подтверждение. В окне подтверждения есть переключатель «Не спрашивать» - он выключает эту настройку."
  STR_HD_ARMOR_SORT_CRAFT: "Броня: сортировка по судну"
  STR_HD_ARMOR_SORT_CRAFT_DESC: "Экран брони судна открывается сразу с сортировкой «Судно»: бойцы на борту - вверху, как если бы вы выбрали её сами. Сортировка, как и ручная, меняет порядок бойцов базы. Выкл - исходный порядок."
  STR_HD_TRANSFER_DONT_ASK: "Не спрашивать"
  STR_HD_CRAFT_OUTLINES: "Контуры кораблей"
  STR_HD_CRAFT_OUTLINES_DESC: "На глобусе ваши корабли и каждое НЛО, однажды прочитанное гипердекодером, — маленькие контуры сверху, НЛО цветом расы экипажа; в перехвате НЛО — контур вместо пятна. Выкл — классические значки."
  STR_HD_PILOT_VOICE: "Голоса пилотов"
  STR_HD_PILOT_VOICE_DESC: "На глобусе экипаж вашего корабля отвечает по рации: когда его выбирают, отправляют на цель, на перехват, в сопровождение, на базу или на другую базу, при вылете звена и при отмене, а в перехвате — при попадании и когда кончились снаряды. У летающих кораблей говорит пилот, у наземной техники — водитель. Громкость — ползунок «Громкость голосов». Выкл — тишина."
  STR_HD_RADAR: "Радары на глобусе"
  STR_HD_RADAR_DESC: "Как рисуется зона обнаружения ваших баз и кораблей. Круги — классический круг на каждый радар. Общая зона — лёгкая заливка с одной общей границей вокруг всех радаров, неподвижная; стоит почти как круги. Развёртка (проба) — то же, и на медленных скоростях (5 секунд, 1 минута) каждый цикл обнаружения запускает от базы волну, по одной на радар, и волна передаётся базам, до которых дошла; у корабля вне зоны баз медленно вращается луч. Волны заметно нагружают процессор. Волны (проба) — без заливки: у баз одна общая граница, и базы пускают волны, когда — см. «Волны баз»; у корабля вне базы свой круг, отдельно от баз, с лучом или волной каждые полчаса — см. «Луч корабля»; главная база отмечена звездой вместо квадрата. Пока время стоит (открыто окно над глобусом), всё это тоже стоит. Только картинка: обнаружение не меняется."
  STR_HD_RADAR_WAVES: "Волны баз"
  STR_HD_RADAR_WAVES_DESC: "Для «Радары на глобусе» = «Волны». Все разом — каждый игровой час все базы с радаром пускают волну вместе, так видно время. По очереди — базы пускают волны по очереди, разнесённые по часу (или по 3 и 6 часам), по нескольку, а не все сразу."
  STR_HD_RADAR_WAVES_0: "Все разом, раз в час"
  STR_HD_RADAR_WAVES_1: "По очереди, раз в час"
  STR_HD_RADAR_WAVES_2: "По очереди, раз в 3 часа"
  STR_HD_RADAR_WAVES_3: "По очереди, раз в 6 часов"
  STR_HD_RADAR_BEAM: "Луч корабля"
  STR_HD_RADAR_BEAM_DESC: "Для «Радары на глобусе» = «Волны». Вкл — у корабля вне базы по кругу его радара вращается луч, как на экране старого радара. Выкл — от корабля волна каждый цикл обнаружения (полчаса)."
  STR_HD_TRAINING_BLOCKS: "Тренировка: какие пути закроет"
  STR_HD_TRAINING_BLOCKS_DESC: "Вкл — на экране подтверждения тренировки строка «Закроет пути»: тренировки, которые станут недоступны бойцу после этой. Щелчок по строке — весь список. Если просмотр дерева исследований выключен, ещё не открытые тренировки показаны знаком «?». Только подсказка."
  STR_HD_PATH_STRETCH: "Длинные стрелки пути на тяжёлой местности"
  STR_HD_PATH_STRETCH_DESC: "Вкл — стрелка пути в бою там, где шаг стоит больше обычного (песок, болото, высокая трава: больше 4 ОД по прямой, 6 по диагонали), рисуется длиннее: две или три стрелки подряд. Так видно, что местность плохо проходима. Только картинка: очки времени не меняются."
  STR_HD_PATH_DIGITS: "Цифры пути шрифтом интерфейса"
  STR_HD_PATH_DIGITS_DESC: "Вкл — очки времени и энергия на клетках пути в бою пишутся чётким шрифтом HD-интерфейса: на шагах мельче, в конце пути крупнее. Выкл — пиксельные цифры, как в классике. Работает с современным видом интерфейса и его шрифтами."
  STR_HD_PATH_NUM_SIZE: "Размер цифр пути"
  STR_HD_PATH_NUM_SIZE_DESC: "Размер цифр очков времени и энергии на клетках пути, в процентах от обычного (100% - как было; цифры остаются на своём месте). Левая кнопка - крупнее, правая - мельче. Работает, когда цифры пути пишутся шрифтом интерфейса."
  STR_HD_PATH_NUM_WEIGHT: "Толщина цифр пути"
  STR_HD_PATH_NUM_WEIGHT_DESC: "Толщина штрихов цифр пути в процентах от обычной (100% - как было). Меньше - тоньше цифры. Работает, когда цифры пути пишутся шрифтом интерфейса."
  STR_HD_AIM_NUM_SIZE: "Размер чисел прицела"
  STR_HD_AIM_NUM_SIZE_DESC: "Размер процента попадания и бонуса навыка (+N) у прицела, в процентах от обычного (100% - как было; числа остаются на своём месте). Левая кнопка - крупнее, правая - мельче. Работает, когда включены шрифты HD-интерфейса."
  STR_HD_AIM_NUM_WEIGHT: "Толщина чисел прицела"
  STR_HD_AIM_NUM_WEIGHT_DESC: "Толщина штрихов процента попадания и бонуса навыка (+N) у прицела в процентах от обычной (100% - как было). Меньше - тоньше цифры. Работает, когда включены шрифты HD-интерфейса."
  STR_HD_BLAST_FALL: "Падение тела от взрыва"
  STR_HD_BLAST_FALL_DESC: "Вкл - убитый или оглушённый уроном по площади (взрыв, разрывной заряд) падает на пол так же, как от пули. Выкл - как в оригинале: тело сразу лежит. Меняется только картинка - урон, смерть и ход боя те же."
  STR_HD_PLAIN_SMOKE: "Дым у пуль и ракет без своего дыма"
  STR_HD_PLAIN_SMOKE_DESC: "Вкл - пуля или ракета, у которой в рулсете мода нет своего дыма (vapor ни у патрона, ни у оружия), оставляет за собой лёгкий серый дымный след. Не затрагивает броски, ближний бой, лазерные и плазменные лучи и снаряды с дымом из мода - у них всё как было. Выкл - как в оригинале. Меняется только картинка: дым не влияет на видимость, попадания, урон и ход ИИ."
  STR_HD_CTRL_ZOOM: "Масштаб карты: Ctrl + колесо"
  STR_HD_CTRL_ZOOM_DESC: "Вкл - Ctrl + колесо мыши приближает и отдаляет карту боя (50-200%). Выкл - масштаб не трогается: Ctrl + колесо меняет уровень, как колесо без Ctrl. Меняется только вид."
  STR_HD_ENEMY_TURN: "Ход противника"
  STR_HD_ENEMY_TURN_DESC: "Как выглядит ход врага и нейтралов. Как было — ничего не добавляется. Скрытый экран — экран «Скрытые перемещения» с полоской «Ход противника» поверх него, что бы ни стояло в настройке карты в ход невидимого врага. Рамка — мягкая рамка по краю экрана: красная в ход врага, жёлтая в ход нейтралов; в ход врага внизу по центру надпись «Ход противника»; панель боя уезжает вниз на время хода (в отладочном режиме она остаётся на месте); в ваш ход она возвращается, но только если её убрала рамка (спрятанная вами панель остаётся спрятанной). Рамка со шкалой — то же, и ещё широкая шкала хода внизу по центру экрана, под надписью: заполняется красным (враг) или жёлтым (нейтралы) по мере того, как их бойцы тратят очки действий (тот же показатель, что у шкалы на экране «Скрытые перемещения»). Только картинка."
  STR_HD_ENEMY_TURN_0: "Как было"
  STR_HD_ENEMY_TURN_1: "Скрытый экран"
  STR_HD_ENEMY_TURN_2: "Рамка"
  STR_HD_ENEMY_TURN_3: "Рамка со шкалой"
  STR_HD_ENEMY_TURN_STRIP: "Ход противника"
  STR_HD_PANEL_HIDE_KEY: "Скрыть/показать панель боя"
  STR_HD_PANEL_HIDE: "Стрелка скрытия панели боя"
  STR_HD_PANEL_HIDE_DESC: "Вкл — над правым верхним углом панели боя маленькая стрелка: щелчок убирает панель вниз за край экрана, стрелка остаётся у края и возвращает панель обратно. Клавиши панели работают и при скрытой панели. Только с современной HD-панелью боя."
  STR_TRAINING_BLOCKS: "Закроет пути: {0}"
  STR_TRAINING_BLOCKS_MORE: " и ещё {0}"
  STR_TRAINING_BLOCKS_UNKNOWN: "? ({0})"
  STR_TRAINING_BLOCKS_TITLE: "Закроет бойцу пути тренировки:"
  STR_HD_RADAR_0: "Круги"
  STR_HD_RADAR_1: "Общая зона"
  STR_HD_RADAR_2: "Развёртка (проба)"
  STR_HD_RADAR_3: "Волны (проба)"
  STR_HD_UI: "HD-интерфейс"
  STR_HD_UI_DESC: "Интерфейс рисуется заново в разрешении экрана: гладкие края букв, чёткие окна и кнопки, картинки hd/UI на своих местах. 0 — выкл (классика, как сейчас), 1 — остальная графика увеличена как есть, 2 — остальная сглажена xBRZ. Нужен 32-битный вывод."
  STR_HD_UI_SKIN: "HD-интерфейс: современный вид"
  STR_HD_UI_SKIN_DESC: "При включённом HD-интерфейсе окна, кнопки, списки и полосы рисуются заново в цветах самого мода. 0 = классический вид с фасками, только чётче; 1 = цветовые рампы мода с мягкими градиентами; 2 = тёмные панели, цвета мода тонкими акцентами; 3 = плоские панели."
  STR_HD_WINDOW_THEME: "HD-интерфейс: кнопки окон в цвет панели боя"
  STR_HD_WINDOW_THEME_DESC: "При современном виде HD-интерфейса кнопки, ползунки, полосы прокрутки и стрелки всех окон (геоскейп, база, бой, настройки) отливаются в металле выбранного ниже цвета панели боя — как рамки окон, а не в цветах палитры экрана. Нажатая или включённая кнопка — металл светлее; подписи на ней тёмные. На остальных подписи светлые; при «Своём цвете» панели кнопки — цвета её кнопок, и подписи на них тёмные, если этот цвет светлый, и светлые, если тёмный. То же у кнопок экрана снаряжения справа вверху (меню, OK, стрелки, разрядка, «на землю», сохранить и применить раскладку). Цвет текста в списках не меняется. Только картинка. Выкл — цвета палитры экрана."
  STR_HD_BATTLE_HUD: "HD-интерфейс: современная панель боя"
  STR_HD_BATTLE_HUD_DESC: "При современном виде HD-интерфейса панель кнопок в бою рисуется заново: тёмная панель, кнопки — плитки с понятными значками, которые подсвечиваются под мышью и при нажатии, ниши под предметами в руках и карточка под именем и показателями бойца. Только картинка: кнопки, их места и действия не меняются. Выкл — картинка панели самого мода, сглаженная."
  STR_HD_BATTLE_HUD_COLOR: "HD-интерфейс: цвет панели боя"
  STR_HD_BATTLE_HUD_COLOR_DESC: "Цвета современной панели боя. Тёмная — тёмная панель со светлыми значками. Золотая — золото оригинальной панели: золотые кнопки с тёмными значками, кнопки резерва залиты своим цветом. Обшивка Консула и обшивка Крейсера — то же золотое устройство панели, но в металле корпусов этих кораблей: светлая сиреневая сталь и тёмная. Корабельная латунь — пульт пиратского корабля: латунные таблички с гравировкой на красном дереве, нарисованные (нужен HD-мод). Космический корабль, Серебро с чернью, Чёрное железо и кость, Бронза глубин — такие же нарисованные пульты: сиреневый сплав на графитовой обшивке, серебро с чернью на чёрном лаке, кованое железо с костью на обугленном дубе, бронза с патиной на медных листах. Свой цвет — цвета, которые вы подбираете сами в окне под этой строкой. Только картинка."
  STR_HD_BATTLE_HUD_COLOR_0: "Тёмная"
  STR_HD_BATTLE_HUD_COLOR_1: "Золотая, как в оригинале"
  STR_HD_BATTLE_HUD_COLOR_2: "Обшивка Консула"
  STR_HD_BATTLE_HUD_COLOR_3: "Обшивка Крейсера"
  STR_HD_BATTLE_HUD_COLOR_4: "Корабельная латунь"
  STR_HD_BATTLE_HUD_COLOR_5: "Космический корабль"
  STR_HD_BATTLE_HUD_COLOR_6: "Серебро с чернью"
  STR_HD_BATTLE_HUD_COLOR_7: "Чёрное железо и кость"
  STR_HD_BATTLE_HUD_COLOR_8: "Бронза глубин"
  STR_HD_BATTLE_HUD_COLOR_9: "Свой цвет"
  STR_HD_CUSTOM_COLOR: "Свой цвет панели"
  STR_HD_CUSTOM_COLOR_TITLE: "Свой цвет"
  STR_HD_CUSTOM_COLOR_DESC: "Открывает окно, где вы сами делаете цвет панели боя: цвет кнопок и цвет фона (рамки, сталь между кнопками, гнёзда, пазы) — каждый по оттенку, насыщенности и яркости. Кнопки окон тоже берут цвет кнопок, если включён цвет кнопок окон по панели боя. «Есть!» сохраняет цвета и делает их цветом панели боя (Свой цвет), «Отмена» возвращает прежние, «Сброс» ставит исходные. Только картинка."
  STR_HD_CUSTOM_KEYS: "Кнопки"
  STR_HD_CUSTOM_BACK: "Фон"
  STR_HD_CUSTOM_HUE: "Оттенок"
  STR_HD_CUSTOM_SAT: "Насыщенность"
  STR_HD_CUSTOM_VAL: "Яркость"
  STR_HD_CUSTOM_RESET: "Сброс"
  STR_HD_BUTTON_FACE: "HD-интерфейс: вид кнопок окон"
  STR_HD_BUTTON_FACE_DESC: "Открывает окно, где кнопкам окон в металле панели боя (опция выше) выбирают рельеф, форму и блеск. Рельефы — калейдоскоп кнопок, каждая отлита в своём: гладкая, шлифованная, литая, чеканка, клёпаная, чешуя, рифлёная, карбон, дерево, молнии, потёртая; «Как раньше» — плоская кнопка. Форма: плита с фаской, подушка, скруглённая до середины, или панель, утопленная в рамку. Блеск: 0 — матовая, 50 — шлифованный цветной металл, 100 — зеркало под цветным стеклом. Свет падает сверху слева. Два ползунка ниже задают текст на кнопках: оттенок (слева, «авто», — цвет, который даёт тема) и яркость (середина — «авто»); текст всегда остаётся читаемым на кнопке. Действует, когда включена опция выше. Только картинка."
  STR_HD_BUTTON_FACE_TITLE: "Вид кнопок"
  STR_HD_BUTTON_GLOSS: "Блеск"
  STR_HD_BUTTON_INK_HUE: "Оттенок текста"
  STR_HD_BUTTON_INK_LIGHT: "Яркость текста"
  STR_HD_BUTTON_INK_AUTO: "авто"
  STR_HD_BUTTON_INK_NEEDS: "нужна тема"
  STR_HD_FACE_FLAT: "Как раньше"
  STR_HD_FACE_SMOOTH: "Гладкая"
  STR_HD_FACE_BRUSHED: "Шлифованная"
  STR_HD_FACE_CAST: "Литая"
  STR_HD_FACE_HAMMERED: "Чеканка"
  STR_HD_FACE_RIVETED: "Клёпаная"
  STR_HD_FACE_SCALES: "Чешуя"
  STR_HD_FACE_TREAD: "Рифлёная"
  STR_HD_FACE_CARBON: "Карбон"
  STR_HD_FACE_WOOD: "Дерево"
  STR_HD_FACE_LIGHTNING: "Молнии"
  STR_HD_FACE_WORN: "Потёртая"
  STR_HD_SHAPE_PLATE: "Плита"
  STR_HD_SHAPE_PILLOW: "Подушка"
  STR_HD_SHAPE_RECESSED: "С углублением"
  STR_HD_SHOT_CUT: "Выстрел обрывает звук прежнего"
  STR_HD_SHOT_CUT_DESC: "Вкл — если оружие стреляет снова, пока звук прошлого выстрела ещё доигрывает, старый быстро затихает. Выкл — звуки накладываются, как в оригинале."
  STR_HD_GLOBE_SCALE: "HD-интерфейс: масштаб глобуса"
  STR_HD_GLOBE_SCALE_DESC: "У глобуса свой масштаб, отдельно от окон, базы и таблиц. «Как геоскейп» — тот же, что «Масштаб глоб. вида» в настройках видео. 2x–6x — глобус рисуется так, как при таком масштабе геоскейпа. Например, геоскейп 5x или 6x — крупные окна, а глобус 3x — подробный. Работает при включённом HD-интерфейсе; значение не мельче масштаба геоскейпа ничего не меняет. Чем меньше число, тем тяжелее на большом экране."
  STR_HD_GLOBE_SCALE_SAME: "Как геоскейп"
  STR_HD_UI_FONT: "HD-интерфейс: шрифт"
  STR_HD_UI_FONT_DESC: "Classic = шрифт самой игры, только сглаженный: цвет, ширина каждой буквы и строки в точности как в классике — текст на подобранных фонах не сдвинется. Остальные значения — гарнитуры TrueType из мода (hd/UI/FontBig.ttf и наборы из hd/UI/fonts), подписаны так, как шрифт зовёт себя сам: красивее, но метрики другие. Переключается сразу, без перезапуска."
  STR_HD_OPTIONS: "HD"
  STR_HD_ART: "Арт"
  STR_HD_BATTLE: "Поле боя"
  STR_HD_PHYSICS: "Физика"
  STR_HD_COLLAPSE: "Обрушение зданий"
  STR_HD_COLLAPSE_DESC: "Взрыв выбил опоры - всё, что осталось без опоры, рушится: этажи, стены, крыши и деревья, бойцы и предметы падают вниз. Обломки бьют тех, кто под ними, ложатся завалом - крошкой, кучами, глыбами, поваленными стволами - и поднимают пыль. Работает на большинстве наземных карт: города, деревни, фермы, свалки, пустыни, леса и джунгли; НЛО, корабли и подземелья не рушатся. Меняет бой, включается и посреди боя."
  STR_HD_COLLAPSE_SHAKE: "Тряска при обрушении"
  STR_HD_COLLAPSE_SHAKE_DESC: "Экран на миг трясёт, когда на виду рушится здание, - тем сильнее, чем больше упало. Только картинка, бой не меняется. Нужно «Обрушение зданий»; в нежном режиме выключена."
  STR_HD_TRUNK_ARMOR: "Прочность стволов деревьев"
  STR_HD_TRUNK_ARMOR_DESC: "Насколько трудно свалить дерево. Оригинал - как в игре: каждый второй ствол валится одной пулей из пистолета. x2 и x3 - броня ствола вдвое и втрое против всего: пуль, взрывов и ударов. Микс - ближе к жизни: пуля и луч почти не валят дерево (x3), взрыв - x1,5, топор и бензопила рубят как в игре. Огонь жжёт как в игре, кроны не меняются. Меняет бой. Нужно «Обрушение зданий»."
  STR_HD_TRUNK_ARMOR_0: "Оригинал"
  STR_HD_TRUNK_ARMOR_1: "x2"
