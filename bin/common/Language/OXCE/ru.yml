  STR_VOICE_VOLUME: "Громкость голосов"
  STR_VOICE_VOLUME_DESC: "Громкость голосов бойцов в бою: при выборе, начале хода, выборе оружия и когда их слишком часто дёргают. При нулевой громкости звука голоса тоже молчат."
  STR_USER_MUSIC_0: "Своя музыка: выкл"
  STR_USER_MUSIC_1: "Своя музыка: вместе"
  STR_USER_MUSIC_2: "Своя музыка: только"
  STR_USER_MUSIC_DESC: "Свои треки из папки \"music\" в папке пользователя (подпапки geoscape и battle; файлы прямо в ней играют и там, и там). Вместе - со стандартной музыкой, Только - лишь ваши, где они есть. Новые файлы подхватывает кнопка «Обновить» в окне выбора трека."
  STR_USER_MUSIC_REFRESH_UC: "ОБНОВИТЬ"
  STR_HD_AI: "Тактический ИИ"
  STR_BETTER_AI: "BetterAI (экспериментально)"
  STR_BETTER_AI_DESC: "Свой экран улучшенного тактического ИИ противника. Экспериментальная функция: по умолчанию выключена, тогда ИИ - стандартный OXCE. Справа - включён ли BetterAI."
  STR_BETTER_AI_BACK: "< Назад"
  STR_BETTER_AI_ON: "BetterAI включён"
  STR_BETTER_AI_ON_DESC: "Экспериментальная функция. Выкл. - стандартный ИИ OXCE, бой как в обычной игре. Вкл. - действуют строки ниже. Меняется после перезапуска игры."
  STR_BETTER_AI_FIXES: "Исправления ошибок ИИ OXCE"
  STR_BETTER_AI_FIXES_DESC: "Ошибки стандартного ИИ: убегая, враг больше не выбирает клетку ближе к бойцу и не бежит по устаревшему плану; цена пути считается верно; юнит не теряет действие, унаследовав счётчик погибшего; не держит путь к недостижимой точке патруля; не бросается в рукопашную на бойца этажом выше; не стреляет управляемой ракетой без маршрута; при обороне базы осматривает весь модуль; помнит, кто в него стрелял, до конца вашего хода; гражданские не зависают рядом с пришельцами. Только при включённом BetterAI, меняется после перезапуска."
  STR_BETTER_AI_AI3: "ИИ AI3 (экспериментально)"
  STR_BETTER_AI_AI3_DESC: "Новые решения ИИ: не тратит выстрелы и удары без шанса на урон, не выбирает рывки в атаку (Лирой) без ОВ на удар, обходит шаг, на котором его уже остановили, иначе выбирает цели для взрывчатки и запас ОВ. Не проверялся в длинных кампаниях. Только при включённом BetterAI, меняется после перезапуска."
  STR_HD_CHALLENGE: "Испытание"
  STR_HD_NO_BATTLE_SAVES: "Без сохранений в бою"
  STR_HD_NO_BATTLE_SAVES_DESC: "Как «Стальная воля», но только в бою и отдельно от неё: в меню боя нет кнопок «Сохранить» и «Загрузить», а выход из боя - «Сохранить и покинуть игру» (бой ложится в автосохранение боя, продолжить - загрузкой из главного меню); не работают быстрое и мгновенное сохранение, быстрая загрузка и автосохранение по ходам, отчёт F8 не прикладывает сейв. На геоскейпе всё как обычно. Механика боя не меняется. Выкл. - как в обычной игре."
  STR_HD_NO_BATTLE_SAVES_LOCKED: "В бою не меняется - только на геоскейпе или в главном меню."
  STR_HD_RULES: "Правила боя"
  STR_HD_KNOWLEDGE_ARMOR: "Знай врага, знай своё оружие"
  STR_HD_KNOWLEDGE_ARMOR_DESC: "Меняет бой (предложение Dioxine). Исследования дают пользу в бою: броня врага, чья статья в Уфопедии открыта, держит ваши попадания хуже (эффективность брони -0,2); оружие или патрон с ещё закрытой статьёй пробивает броню хуже (+0,2, один раз на оружие с патроном; предметы без своей статьи не затронуты). Зеркально для врага: за каждую единицу его интеллекта выше 4 ваша броня работает на 0,05 хуже, ниже 4 - лучше; трудная сложность прибавляет ему интеллект (новичок -1, гений +1, сверхчеловек +2). ИИ врага это учитывает. Мод может поменять числа (ключ рулсета knowledgeArmor). Выкл. - как в OXCE."
  STR_HD_INTERFACE: "Интерфейс"
  STR_HD_SPEED: "Скорость"
